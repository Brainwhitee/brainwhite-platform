name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './apps/web/package-lock.json'
    - name: Install dependencies
      working-directory: ./apps/web
      run: npm ci
    - name: Run linter
      working-directory: ./apps/web
      run: npm run lint
    - name: Build Next.js
      working-directory: ./apps/web
      run: npm run build
